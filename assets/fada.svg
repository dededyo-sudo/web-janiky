<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Fada, médica dentista e assistente virtual">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#EAF6FF"/>
      <stop offset="1" stop-color="#BFDDF7"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A1810"/>
      <stop offset="1" stop-color="#1A0E09"/>
    </linearGradient>
    <clipPath id="c"><circle cx="60" cy="60" r="60"/></clipPath>
  </defs>
  <circle cx="60" cy="60" r="60" fill="url(#bg)"/>
  <g clip-path="url(#c)">
    <!-- cabelo comprido atrás (cai sobre os ombros) -->
    <path d="M30 58c-3-26 11-40 30-40s33 14 30 40c-1 14 4 30 6 52H24c2-22 7-38 6-52z" fill="url(#hair)"/>
    <!-- bata branca -->
    <path d="M22 124c2-22 16-34 38-34s36 12 38 34z" fill="#FFFFFF"/>
    <!-- blusa azul -->
    <path d="M50 91l10 14 10-14c-3-1-6-1.5-10-1.5s-7 .5-10 1.5z" fill="#1468C7"/>
    <!-- lapelas -->
    <path d="M50 91l10 14-6 19H42l2-24z" fill="#F3F7FB" stroke="#D3E1EF" stroke-width="1"/>
    <path d="M70 91l-10 14 6 19h12l-2-24z" fill="#F3F7FB" stroke="#D3E1EF" stroke-width="1"/>
    <!-- madeixas longas à frente dos ombros (tranças) -->
    <g fill="#24150E" stroke="#3A2418" stroke-width=".8">
      <path d="M37 62c-4 14-6 30-5 52h9c-1-20 0-36 3-50z"/>
      <path d="M83 62c4 14 6 30 5 52h-9c1-20 0-36-3-50z"/>
    </g>
    <g fill="none" stroke="#4A2E1F" stroke-width="1" stroke-linecap="round" opacity=".9">
      <path d="M36 72q3 2 6 0M35 80q3 2 6 0M34 88q3 2 6 0M34 96q3 2 6 0M33 104q3 2 6 0"/>
      <path d="M78 72q3 2 6 0M79 80q3 2 6 0M80 88q3 2 6 0M80 96q3 2 6 0M81 104q3 2 6 0"/>
    </g>
    <!-- bolso, caneta e crachá dente -->
    <rect x="66" y="110" width="12" height="9" rx="2" fill="#F3F7FB" stroke="#D3E1EF"/>
    <rect x="69" y="104" width="2.4" height="9" rx="1" fill="#22A45D"/>
    <g transform="translate(46 108)">
      <rect width="11" height="11" rx="3" fill="#1468C7"/>
      <path d="M2.7 3.4c.8-.7 1.6-.4 2.8-.1 1.2-.3 2-.6 2.8.1.9.8.6 2.3.2 3.5-.3.7-.4 1.6-.9 1.6-.7 0-.6-1.7-2.1-1.7s-1.4 1.7-2.1 1.7c-.5 0-.7-.9-.9-1.6-.4-1.2-.7-2.7.2-3.5z" fill="#fff"/>
    </g>
    <!-- pescoço -->
    <rect x="53" y="78" width="14" height="14" rx="6" fill="#6E4129"/>
    <!-- rosto -->
    <ellipse cx="60" cy="60" rx="19.5" ry="23" fill="#7E4B30"/>
    <!-- cabelo frente: risca ao meio -->
    <path d="M40 62c-2-20 6-31 20-31 0 0-3 8-14 14-3 4-5 10-6 17z" fill="url(#hair)"/>
    <path d="M80 62c2-20-6-31-20-31 0 0 3 8 14 14 3 4 5 10 6 17z" fill="url(#hair)"/>
    <!-- brincos -->
    <circle cx="41" cy="70" r="2.2" fill="#E0B23C"/>
    <circle cx="79" cy="70" r="2.2" fill="#E0B23C"/>
    <!-- olhos -->
    <ellipse cx="51.5" cy="61" rx="2.6" ry="3.1" fill="#1B0F0A"/>
    <ellipse cx="68.5" cy="61" rx="2.6" ry="3.1" fill="#1B0F0A"/>
    <circle cx="52.4" cy="60" r=".9" fill="#fff"/>
    <circle cx="69.4" cy="60" r=".9" fill="#fff"/>
    <path d="M47.5 57.5l-1.6-1.4M55.5 57.5l1-1.7M64.5 57.5l-1-1.7M72.5 57.5l1.6-1.4" stroke="#1B0F0A" stroke-width="1" stroke-linecap="round"/>
    <path d="M46 53q5-2.5 10 0M64 53q5-2.5 10 0" stroke="#1B0F0A" stroke-width="1.7" fill="none" stroke-linecap="round"/>
    <!-- nariz, bochechas e sorriso -->
    <path d="M57.5 67q2.5 1.8 5 0" stroke="#5A321F" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <ellipse cx="46" cy="70" rx="3.6" ry="2" fill="#D9806E" opacity=".45"/>
    <ellipse cx="74" cy="70" rx="3.6" ry="2" fill="#D9806E" opacity=".45"/>
    <path d="M52.5 72q7.5 7 15 0z" fill="#fff" stroke="#9A3E2E" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- estetoscópio -->
    <path d="M48 90c-2 7 0 12 5 14M72 90c2 7 0 12-5 14" fill="none" stroke="#2A3B4D" stroke-width="2" stroke-linecap="round"/>
    <circle cx="60" cy="105" r="3.2" fill="#9AA8B6" stroke="#2A3B4D" stroke-width="1.4"/>
  </g>
  <circle cx="60" cy="60" r="58.5" fill="none" stroke="#fff" stroke-width="3" opacity=".6"/>
</svg>
