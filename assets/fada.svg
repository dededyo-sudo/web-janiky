<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Dra. Fada, médica dentista e assistente virtual">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#EAF6FF"/>
      <stop offset="1" stop-color="#BFDDF7"/>
    </radialGradient>
    <clipPath id="c"><circle cx="60" cy="60" r="60"/></clipPath>
  </defs>
  <circle cx="60" cy="60" r="60" fill="url(#bg)"/>
  <g clip-path="url(#c)">
    <!-- cabelo atrás (comprimento médio) -->
    <path d="M34 60c-2-24 10-38 26-38s28 14 26 38c-1 10 1 18 4 24H30c3-6 5-14 4-24z" fill="#24160F"/>
    <!-- bata branca -->
    <path d="M22 124c2-22 16-34 38-34s36 12 38 34z" fill="#FFFFFF"/>
    <!-- blusa por baixo (azul clínica) -->
    <path d="M50 91l10 14 10-14c-3-1-6-1.5-10-1.5s-7 .5-10 1.5z" fill="#1468C7"/>
    <!-- lapelas -->
    <path d="M50 91l10 14-6 19H42l2-24z" fill="#F3F7FB" stroke="#D3E1EF" stroke-width="1"/>
    <path d="M70 91l-10 14 6 19h12l-2-24z" fill="#F3F7FB" stroke="#D3E1EF" stroke-width="1"/>
    <!-- bolso com caneta e crachá dente -->
    <rect x="73" y="108" width="14" height="10" rx="2" fill="#F3F7FB" stroke="#D3E1EF"/>
    <rect x="76" y="102" width="2.4" height="9" rx="1" fill="#22A45D"/>
    <g transform="translate(33 104)">
      <rect width="13" height="13" rx="3" fill="#1468C7"/>
      <path d="M3.2 4c.9-.8 1.9-.5 3.3-.1 1.4-.4 2.4-.7 3.3.1 1 .9.7 2.7.2 4.1-.3.8-.5 1.9-1.1 1.9-.8 0-.7-2-2.4-2s-1.6 2-2.4 2c-.6 0-.8-1.1-1.1-1.9-.5-1.4-.8-3.2.2-4.1z" fill="#fff"/>
    </g>
    <!-- espelho dentário no bolso -->
    <line x1="81" y1="96" x2="83" y2="110" stroke="#9AA8B6" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="80.6" cy="94.5" r="2.4" fill="#DDE7F0" stroke="#9AA8B6" stroke-width="1"/>
    <!-- pescoço -->
    <rect x="53" y="78" width="14" height="14" rx="6" fill="#6E4129"/>
    <!-- rosto -->
    <ellipse cx="60" cy="60" rx="20" ry="23" fill="#7E4B30"/>
    <!-- cabelo frente: risca lateral e coque -->
    <circle cx="60" cy="24" r="10" fill="#24160F"/>
    <path d="M39 58c0-18 9-27 21-27s21 9 21 27c-5-9-12-14-21-15-8 1-15 5-21 15z" fill="#24160F"/>
    <!-- brincos -->
    <circle cx="40" cy="68" r="2" fill="#E0B23C"/>
    <circle cx="80" cy="68" r="2" fill="#E0B23C"/>
    <!-- óculos -->
    <g fill="none" stroke="#2A3B4D" stroke-width="1.8">
      <rect x="44" y="56" width="13" height="10" rx="4"/>
      <rect x="63" y="56" width="13" height="10" rx="4"/>
      <path d="M57 60q3-2 6 0"/>
    </g>
    <!-- olhos -->
    <ellipse cx="50.5" cy="61" rx="2.4" ry="2.8" fill="#1B0F0A"/>
    <ellipse cx="69.5" cy="61" rx="2.4" ry="2.8" fill="#1B0F0A"/>
    <circle cx="51.3" cy="60.1" r=".8" fill="#fff"/>
    <circle cx="70.3" cy="60.1" r=".8" fill="#fff"/>
    <path d="M45 52q5-2.5 10 0M65 52q5-2.5 10 0" stroke="#1B0F0A" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <!-- nariz, bochechas e sorriso com dentes -->
    <path d="M59 64q1 4 3 4" stroke="#5A321F" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <ellipse cx="45" cy="70" rx="3.6" ry="2" fill="#D9806E" opacity=".45"/>
    <ellipse cx="75" cy="70" rx="3.6" ry="2" fill="#D9806E" opacity=".45"/>
    <path d="M52 72q8 7 16 0z" fill="#fff" stroke="#8E3B2C" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- estetoscópio -->
    <path d="M47 90c-2 8 0 14 6 16M73 90c2 8 0 14-6 16" fill="none" stroke="#2A3B4D" stroke-width="2" stroke-linecap="round"/>
    <circle cx="60" cy="107" r="3.2" fill="#9AA8B6" stroke="#2A3B4D" stroke-width="1.4"/>
  </g>
  <circle cx="60" cy="60" r="58.5" fill="none" stroke="#fff" stroke-width="3" opacity=".6"/>
</svg>
